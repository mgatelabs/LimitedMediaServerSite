<ng-container *transloco="let t">

  <div class="log-header">
    <span class="log-title">{{ t('form.task_logging') }}</span>
  </div>

  <div class="log-body">

    <!-- DESKTOP TABLE VIEW -->
    <table class="log-table" *ngIf="!(isMobile | async)">
      <thead class="log-thead">
        <tr>
          <th class="time">{{ t('form.time') }}</th>
          <th class="icon"></th>
          <th class="copy"></th>
          <th>{{ t('form.message') }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logs; trackBy: trackByLog" [class]="getClass(log)">
          <td>{{ log.time }}</td>
          <td><mat-icon>{{ getIcon(log) }}</mat-icon></td>
          <td>
            <button mat-icon-button (click)="copy(log.text)">
              <mat-icon>content_copy</mat-icon>
            </button>
          </td>
          <td class="message" [innerHTML]="getSafeText(log)"></td>
        </tr>
      </tbody>
    </table>

    <!-- MOBILE LIST VIEW -->
    <mat-list *ngIf="isMobile | async" class="log-list">
      <mat-list-item *ngFor="let log of logs; trackBy: trackByLog">
        <mat-icon matListItemIcon>{{ getIcon(log) }}</mat-icon>
        <div matListItemTitle class="message" [innerHTML]="isMarkdown(log) ? getRenderedHtml(log) : log.text"></div>
        <div matListItemLine class="time">{{ log.time }}</div>
        <button mat-icon-button matListItemMeta (click)="copy(log.text)">
          <mat-icon>content_copy</mat-icon>
        </button>
      </mat-list-item>
    </mat-list>

  </div>

  <div class="log-footer">
    <mat-paginator
      [length]="logTotal"
      [pageSize]="logPageSize"
      [pageSizeOptions]="pageSizeOptions"
      [pageIndex]="logPageIndex"
      [hidePageSize]="hidePageSize"
      [showFirstLastButtons]="showFirstLast"
      [disabled]="logTotal <= logPageSize"
      (page)="pageChange.emit($event)"
      aria-label="Log entries page">
    </mat-paginator>
  </div>

</ng-container>
